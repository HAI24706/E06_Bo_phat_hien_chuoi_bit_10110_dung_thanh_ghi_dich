name: RTL-to-GDSII E06 Automation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install OpenLane & YoWASP Yosys
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev git libffi-dev tcl tk verilator
          python -m pip install --upgrade pip
          pip install openlane yowasp-yosys

      - name: Fix Yosys Executable Symlink for OpenLane v2
        run: |
          # Tìm đường dẫn yowasp-yosys và tạo symlink thành yosys để OpenLane v2 nhận diện trực tiếp
          YOSYS_PATH=$(which yowasp-yosys || find ~/.local/bin /usr/local/bin /usr/bin -name "yowasp-yosys" 2>/dev/null | head -n 1)
          if [ -z "$YOSYS_PATH" ]; then
            YOSYS_PATH=$(python3 -c "import shutil; print(shutil.which('yowasp-yosys') or '')")
          fi
          echo "Found yowasp-yosys at: $YOSYS_PATH"
          sudo ln -sf "$YOSYS_PATH" /usr/local/bin/yosys
          sudo chmod +x /usr/local/bin/yosys
          yosys --version || echo "Yosys symlink created successfully."

      - name: Run OpenLane Flow v2
        run: |
          python3 -m openlane --pdk sky130A 04_IMPLEMENTATION/config.json

      - name: Upload GDSII Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdsii-output
          path: |
            04_IMPLEMENTATION/runs/**/results/
            04_IMPLEMENTATION/runs/**/final/
