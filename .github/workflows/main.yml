name: RTL-to-GDSII Automation (E06)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-gds:
    runs-on: ubuntu-latest
    container:
      image: efabless/openlane:latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run OpenLane Flow (Sky130A)
        run: |
          flow.tcl -design . -pdk sky130A

      - name: Upload GDSII Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gdsii-output
          path: runs/*/results/
