name: RTL-to-GDSII E06 Automation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run OpenLane v2 in Official Docker Container
        uses: efabless/openlane-action@main
        with:
          pdk: sky130A
          config: 04_IMPLEMENTATION/config.json

      - name: Upload GDSII Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdsii-output
          path: |
            04_IMPLEMENTATION/runs/**/results/
            04_IMPLEMENTATION/runs/**/final/
