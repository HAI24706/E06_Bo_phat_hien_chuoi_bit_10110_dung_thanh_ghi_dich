name: RTL-to-GDSII E06 Automation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run OpenLane v2 Official Docker (Stable Version)
        run: |
          # Dùng đúng tag phiên bản 2.3.10 chính thức của OpenLane v2 để không bị lỗi not found
          docker run --rm \
            -v $(pwd):/workspace \
            -w /workspace \
            ghcr.io/efabless/openlane2:2.3.10 \
            python3 -m openlane --pdk sky130A 04_IMPLEMENTATION/config.json

      - name: Upload GDSII Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdsii-output
          path: |
            04_IMPLEMENTATION/runs/**/results/
            04_IMPLEMENTATION/runs/**/final/
