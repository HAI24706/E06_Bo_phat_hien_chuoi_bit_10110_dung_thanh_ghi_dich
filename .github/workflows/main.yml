name: RTL-to-GDSII E06 Automation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run OpenLane v2 via Official Docker Image
        run: |
          # Kéo và chạy trực tiếp container chính thức của OpenLane v2, mount thư mục thiết kế vào trong container
          docker pull ghcr.io/efabless/openlane2:latest
          docker run --rm \
            -v $(pwd):/workspace \
            -w /workspace \
            ghcr.io/efabless/openlane2:latest \
            python3 -m openlane --pdk sky130A 04_IMPLEMENTATION/config.json

      - name: Upload GDSII Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdsii-output
          path: |
            04_IMPLEMENTATION/runs/**/results/
            04_IMPLEMENTATION/runs/**/final/
