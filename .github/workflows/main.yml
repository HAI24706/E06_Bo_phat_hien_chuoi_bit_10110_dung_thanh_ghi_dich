name: RTL-to-GDSII E06 Automation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install OpenLane CLI
        run: |
          python -m pip install --upgrade pip
          pip install openlane

      - name: Run OpenLane Flow v2 (Dockerized Mode)
        run: |
          # Cờ --dockerized giúp OpenLane tự động chạy trong môi trường chứa đầy đủ mọi công cụ Yosys, OpenROAD và PDK
          python3 -m openlane --dockerized --pdk sky130A 04_IMPLEMENTATION/config.json

      - name: Upload GDSII Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdsii-output
          path: |
            04_IMPLEMENTATION/runs/**/results/
            04_IMPLEMENTATION/runs/**/final/
