name: RTL-to-GDSII E06

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  run-openlane:
    runs-on: ubuntu-latest
    container:
      image: efabless/openlane:2023.12.11_git96bca48
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run OpenLane Flow
        run: |
          flow.tcl -design . -pdk sky130A

      - name: Upload GDSII Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdsii-output
          path: runs/*/results/
