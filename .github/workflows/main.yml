name: RTL-to-GDSII E06 Automation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev git libffi-dev tcl tk verilator
          python -m pip install --upgrade pip
          pip install openlane yowasp-yosys

      - name: Create Robust Yosys Wrapper
        run: |
          # Tạo tệp thực thi yosys ánh xạ trực tiếp sang yowasp-yosys để json_header.py gọi thành công
          sudo tee /usr/local/bin/yosys > /dev/null << 'EOF'
          #!/bin/bash
          exec yowasp-yosys "$@"
          EOF
          sudo chmod +x /usr/local/bin/yosys
          yosys --version

      - name: Run OpenLane Flow
        env:
          PDK_ROOT: "/opt/sky130A"
        run: |
          python3 -m openlane --pdk sky130A 04_IMPLEMENTATION/config.json

      - name: Upload GDSII Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdsii-output
          path: |
            04_IMPLEMENTATION/runs/**/results/
            04_IMPLEMENTATION/runs/**/final/
