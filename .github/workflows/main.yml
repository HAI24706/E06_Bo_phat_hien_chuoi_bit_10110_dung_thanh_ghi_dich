name: RTL-to-GDSII LibreLane (E06)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org https://fossi.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= fossi.cachix.org-1:4VvcGtHnjH18tT69H1KjW0JdY9116vJ8eT6o9vN8V8M=

      - name: Run LibreLane & Generate GDSII
        run: |
          nix-shell -p python311Packages.pip python311 git --run "
            pip install librelane
            volare install --pdk sky130A --latest
            librelane --pdk sky130A config.json
          "

      - name: Upload GDSII Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdsii-output
          path: runs/*/results/
