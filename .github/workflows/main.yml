name: RTL-to-GDSII E06 Automation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run OpenLane via Official OpenROAD Docker Image
        run: |
          docker pull ghcr.io/the-openroad-project/openlane:latest
          docker run --rm \
            -v $(pwd):/workspace \
            -w /workspace \
            ghcr.io/the-openroad-project/openlane:latest \
            flow.tcl -design 04_IMPLEMENTATION -pdk sky130A -tag run -overwrite

      - name: Upload GDSII Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdsii-output
          path: |
            04_IMPLEMENTATION/runs/**/results/
            04_IMPLEMENTATION/runs/**/final/
