name: RTL-to-GDSII E06 Automation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Auto-Install Dependencies & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev git libffi-dev tcl tk verilator
          python -m pip install --upgrade pip
          pip install openlane yowasp-yosys

      - name: Auto-Fix Yosys Wrapper & Permissions
        run: |
          # Tự động tạo wrapper bọc yowasp-yosys thành lệnh yosys để qua mặt bước json_header.py
          sudo tee /usr/local/bin/yosys > /dev/null << 'EOF'
          #!/bin/bash
          exec yowasp-yosys "$@"
          EOF
          sudo chmod +x /usr/local/bin/yosys
          echo "Yosys wrapper created successfully at /usr/local/bin/yosys"
          yosys --version

      - name: Run OpenLane Flow with Error Mitigation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PDK_ROOT: "/opt/sky130A"
        run: |
          # Chạy luồng OpenLane trực tiếp bằng Python, tự động bỏ qua các lỗi linter đã được cấu hình trong config.json
          python3 -m openlane --pdk sky130A 04_IMPLEMENTATION/config.json

      - name: Upload GDSII Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdsii-output
          path: |
            04_IMPLEMENTATION/runs/**/results/
            04_IMPLEMENTATION/runs/**/final/
