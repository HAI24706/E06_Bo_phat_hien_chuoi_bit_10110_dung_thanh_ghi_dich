name: RTL-to-GDSII LibreLane (E06)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  librelane-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev git libffi-dev

      - name: Install LibreLane and PDK
        run: |
          python -m pip install --upgrade pip
          pip install librelane
          volare --version || pip install volare
          volare install --pdk sky130A --latest

      - name: Execute LibreLane Flow
        run: |
          librelane --pdk sky130A config.json

      - name: Upload GDSII Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdsii-output
          path: runs/*/results/
