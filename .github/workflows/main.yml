name: RTL-to-GDSII E06 Automation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install OpenLane & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev git libffi-dev tcl tk
          python -m pip install --upgrade pip
          pip install openlane

      - name: Run OpenLane Flow
        run: |
          # Tìm và gọi chính xác đường dẫn tệp flow.tcl đã cài đặt
          python3 -m pip show openlane
          python3 -c "import openlane; import pathlib; print(pathlib.Path(openlane.__file__).parent)"
          
          # Cấu hình PATH bao gồm thư mục chứa script của python user/system
          export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"
          
          # Thử chạy flow.tcl trực tiếp hoặc thông qua python module
          if command -v flow.tcl &> /dev/null; then
              flow.tcl -design . -pdk sky130A
          else
              python3 -m openlane.cli -design . -pdk sky130A || python3 $(python3 -c "import site; print(site.getsitepackages()[0])")/openlane/flow.tcl -design . -pdk sky130A
          fi

      - name: Upload GDSII Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdsii-output
          path: runs/*/results/
